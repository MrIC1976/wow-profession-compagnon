<section class="home-page">

  <header class="page-header">
    <h1>WoW Profession Compagnon</h1>

    <p>
      Bienvenue dans votre compagnon World of Warcraft.
    </p>
  </header>

  <section class="backend-status">

    <h2>État du Backend</h2>

    @if (backendOnline && backend) {

      <p>🟢 Backend connecté</p>

      <ul>
        <li>
          <strong>Application :</strong>
          {{ backend.application }}
        </li>

        <li>
          <strong>Version :</strong>
          {{ backend.version }}
        </li>

        <li>
          <strong>Statut :</strong>
          {{ backend.status }}
        </li>
      </ul>

    } @else {

      <p>🔴 {{ error }}</p>

    }

  </section>

  <hr>

  <!-- ========================================================= -->
  <!-- Liste des métiers récupérés depuis Spring Boot            -->
  <!-- ========================================================= -->

  <app-profession-list></app-profession-list>
